core:
  - changed-files:
      - any-glob-to-any-file: ['alos/core/**', 'alos/domain/**', 'alos/application/**']

database:
  - changed-files:
      - any-glob-to-any-file: ['alos/db/**', 'alos/adapters/outbound/db/**', 'alembic/**']

engine:
  - changed-files:
      - any-glob-to-any-file: ['alos/engine/**', 'alos/swarm/**']

memory:
  - changed-files:
      - any-glob-to-any-file: ['alos/memory/**', 'alos/adapters/outbound/vault/**', 'alos/adapters/outbound/rag/**']

integrations:
  - changed-files:
      - any-glob-to-any-file: ['alos/integrations/**', 'alos/adapters/outbound/integrations/**']

rust:
  - changed-files:
      - any-glob-to-any-file: ['crates/**', 'deny.toml']

testing:
  - changed-files:
      - any-glob-to-any-file: ['tests/**', 'features/**']

documentation:
  - changed-files:
      - any-glob-to-any-file: ['docs/**', 'mkdocs.yml', '*.md']

'ci/cd':
  - changed-files:
      - any-glob-to-any-file: ['.github/**']

governance:
  - changed-files:
      - any-glob-to-any-file: ['.github/rulesets/**', 'docs/adr/**', '.specify/**']

security:
  - changed-files:
      - any-glob-to-any-file: ['SECURITY.md', 'deny.toml', '.github/workflows/security-compliance.yml']

release:
  - changed-files:
      - any-glob-to-any-file: ['release-please-config.json', '.release-please-manifest.json', 'CHANGELOG.md']

infrastructure:
  - changed-files:
      - any-glob-to-any-file: ['docker-compose*', 'Dockerfile*', '.dockerignore']

specs:
  - changed-files:
      - any-glob-to-any-file: ['specs/**']

schemas:
  - changed-files:
      - any-glob-to-any-file: ['alos/schemas/**', 'alos/domain/models/**']
