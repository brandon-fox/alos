# This workflow runs a comprehensive parallel quality gate for the ALOS project.
# It includes path filtering to isolate Python checks from Rust-only changes,
# optimized uv dependency caching, and open-source ML model weight caching (up to 2GB).

name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-size:
    if: github.event_name == 'pull_request'
    uses: brandon-fox/.github/.github/workflows/pr-size-guard.yml@093fbcf217975354790f21e30f7ce4e4061d35c2 # main

  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3.0.2
        id: filter
        with:
          filters: |
            python:
              - 'alos/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'alembic/**'
              - 'alembic.ini'
              - '.github/workflows/quality-gate.yml'
            rust:
              - 'crates/**'
              - 'Cargo.lock'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*'

  uv-lock-check:
    name: uv-lock-check
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          sync: 'false'
      - name: Verify uv.lock Sync
        run: uv lock --check

  ruff-lint:
    name: ruff-lint
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Ruff Lint
        run: uv run ruff check alos tests
      - name: Ruff Format Check
        run: uv run ruff format --check alos tests

  mypy-types:
    name: mypy-types
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: MyPy Static Analysis
        run: uv run mypy alos

  bandit-security:
    name: bandit-security
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Bandit Security Scan
        run: uv run bandit -r alos -s B101 -f json -o bandit-report.json || true
      - name: Bandit Human Report
        run: uv run bandit -r alos -s B101

  pytest-suite:
    name: pytest-suite
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - uses: brandon-fox/.github/.github/actions/cache-ml-weights@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Run Tests with Coverage
        # The floor sits two points under the 87% measured on main on 2026-11-10. Raise it as
        # coverage rises; never lower it to make a pull request pass.
        run: uv run pytest --cov=alos --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=85
      - name: Run Behave Mocked BDD Suite
        run: uv run behave --tags=@mocked --no-capture
      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  adr-governance:
    name: adr-governance
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Verify ADR Repository
        run: uv run pyadr check-adr-repo

  dependency-review:
    name: dependency-review
    needs: [changes]
    if: github.event_name == 'pull_request' && (needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          comment-summary-in-pr: always
          allow-licenses: 'MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, Python-2.0, Unlicense, 0BSD, MPL-2.0, CC0-1.0, LGPL-2.1-or-later, LGPL-3.0-or-later, BSD-3-Clause-Clear'

  action-pins-exist:
    name: action-pins-exist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every pinned action commit must exist upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pin that is 40 hex characters but names no real commit passes a format check
          # and fails only when the job runs. Ask GitHub whether each one exists.
          set -euo pipefail
          grep -rhoE 'us[e]s: +[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}' .github/workflows \
            | sed -E 's/^[a-z]+: +//' | sort -u > pins.txt
          missing=0
          while IFS='@' read -r action sha; do
            repo=$(echo "$action" | cut -d/ -f1-2)
            if ! gh api "repos/${repo}/git/commits/${sha}" --silent 2>/dev/null; then
              echo "::error::${action}@${sha} does not exist in ${repo}"
              missing=1
            fi
          done < pins.txt
          echo "checked $(wc -l < pins.txt) pinned actions"
          exit "$missing"

  docker-validate:
    name: docker-validate
    needs: [changes]
    if: needs.changes.outputs.docker == 'true' || contains(github.event.head_commit.message, 'docker') || contains(github.event.head_commit.message, 'compose')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  crewai-validation:
    name: crewai-validation
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - uses: brandon-fox/.github/.github/actions/cache-ml-weights@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Validate CrewAI Local Setup
        run: uv run pytest tests/test_crewai_local.py
