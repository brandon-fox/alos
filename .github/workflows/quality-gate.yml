# Unified Quality Gate & Terminal Merge Gate (Spec 038 FR-001..FR-006)
# Consolidates Python static analysis, dual-OS pytest/Behave, Rust PyO3/cargo-deny/mutants,
# Docker/Sandbox isolation, SpecKit/ADR/ADE governance, and strict Dependency Review behind ci-merge-gate.

name: Quality Gate

on:
  pull_request:
    branches: [main]
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr-size:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    uses: brandon-fox/.github/.github/workflows/pr-size-guard.yml@093fbcf217975354790f21e30f7ce4e4061d35c2 # main

  pr-governance:
    name: pr-governance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Auto-label same-repo PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Conventional PR title
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enforce branch naming strategy
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_AUTHOR" = "github-actions[bot]" ]; then
            exit 0
          fi
          if ! echo "$HEAD_REF" | grep -Eq '^(feat|fix|chore|docs|ci|refactor|test|build|perf|release|hotfix|stack|dependabot|autofix|brand)/[A-Za-z0-9._/-]+$|^[0-9]{3}-[a-z0-9-]+$'; then
            echo "::error::Branch '$HEAD_REF' must use an allowed trunk-based prefix (feat/, fix/, chore/, docs/, ci/, refactor/, test/, build/, perf/, release/, hotfix/, stack/, NNN-*)."
            exit 1
          fi

      - name: Validate First-ADE axioms & commit signatures
        if: github.event_name != 'merge_group'
        uses: First-ADE/.github/.github/actions/ade-axioms@de17a5a93b5b00b8bf073d25299202680a93bd78 # main

      - name: Diagnose unsigned commits on axiom failure
        if: failure() && github.event_name != 'merge_group'
        run: |
          RANGE=$(git rev-parse --verify origin/main >/dev/null 2>&1 && echo "origin/main...HEAD" || echo "HEAD~1..HEAD")
          for sha in $(git log "$RANGE" --format="%H" 2>/dev/null || true); do
            git cat-file commit "$sha" | grep -q '^gpgsig' || echo "::error::Unsigned commit missing gpgsig: $(git log -1 --format='%h %an | %cn | %s' "$sha")"
          done

      - name: Generate SpecKit Quality Digest on Spec PRs
        id: spec_digest
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(specs/|\.specify/)'; then
            python3 .github/scripts/spec_review.py
            echo "post=true" >> "$GITHUB_OUTPUT"
          else
            echo "post=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post or Update SpecKit Digest Comment
        if: steps.spec_digest.outputs.post == 'true'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const botTag = '<!-- spec-analyzer-bot-comment -->';
            const fullBody = `${botTag}\n${fs.readFileSync('spec_review_report.md', 'utf8')}`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(botTag));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Lint GitHub Actions workflows (actionlint)
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          files: |
            .github/workflows/quality-gate.yml
            .github/workflows/auto-merge.yml

      - name: Audit workflow security (zizmor)
        uses: zizmorcore/zizmor-action@1b4550e929643b8b26a62303c6bd64814271a4f1 # v0.9.2
        with:
          inputs: '.github/workflows/quality-gate.yml .github/workflows/auto-merge.yml'
          min-severity: high
          min-confidence: high
          advanced-security: 'false'
          annotations: 'true'

      - name: Verify every pinned action SHA exists upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -rhoE 'us[e]s: +[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}' .github/workflows \
            | sed -E 's/^[a-z]+: +//' | sort -u > pins.txt
          missing=0
          while IFS='@' read -r action sha; do
            repo=$(echo "$action" | cut -d/ -f1-2)
            if ! gh api "repos/${repo}/git/commits/${sha}" --silent 2>/dev/null; then
              echo "::error::${action}@${sha} does not exist in ${repo}"
              missing=1
            fi
          done < pins.txt
          echo "Verified $(wc -l < pins.txt) pinned action SHAs."
          exit "$missing"

  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            python:
              - 'alos/**'
              - 'tests/**'
              - 'features/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'alembic/**'
              - 'alembic.ini'
              - '.github/**'
              - 'specs/**'
              - '.specify/**'
              - 'docs/adr/**'
              - 'mkdocs.yml'
              - 'deny.toml'
            rust:
              - 'crates/**'
              - 'deny.toml'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*'
              - '.dockerignore'
              - 'alos/swarm/sandbox.py'
              - 'tests/test_swarm_sandbox.py'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - '*.md'

  python-static:
    name: python-static
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || needs.changes.outputs.docs == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-ci
      - name: Verify uv.lock, Ruff, MyPy, Bandit, ADRs, Docs & SpecKit Completeness
        run: |
          set -euo pipefail
          uv lock --check
          uv run ruff check alos tests features scripts
          uv run ruff format --check alos tests features scripts
          uv run mypy alos tests features scripts
          uv run bandit -r alos -s B101
          uv run pyadr check-adr-repo
          uv run mkdocs build --strict -d .pytest_tmp/mkdocs_site
          uv run python - << 'PY'
          from pathlib import Path
          specs = sorted(Path("specs").glob("[0-9][0-9][0-9]-*"))
          missing = [
              f"{d.name}/{req}"
              for d in specs
              for req in ("spec.md", "plan.md", "tasks.md")
              if not (d / req).exists()
          ]
          if missing:
              raise SystemExit(f"Missing SpecKit files: {missing}")
          print(f"Audited {len(specs)} SpecKit feature directories cleanly.")
          PY

  pytest-suite:
    name: pytest-suite
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-ci
      - uses: brandon-fox/.github/.github/actions/cache-ml-weights@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Run Parallel Tests with Branch Coverage (Linux)
        run: uv run python scripts/run_pytest_clean.py --keep-coverage --cov=alos --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=90
      - name: Run Parallel Mocked Behave BDD Suite (Linux)
        run: uv run python scripts/run_behave_parallel.py --tags="@mocked" --junit-xml=reports/behave-linux.xml
      - name: Upload Linux Coverage Shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: coverage-shard-ubuntu
          include-hidden-files: true
          path: |
            .coverage
            coverage.xml
          retention-days: 7

  pytest-windows:
    name: pytest-windows
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-ci
      - name: Run Parallel Tests with Branch Coverage (Windows)
        run: uv run python scripts/run_pytest_clean.py --keep-coverage --cov=alos --cov-report=term-missing --cov-fail-under=90
      - name: Run Parallel Mocked Behave BDD Suite (Windows)
        run: uv run python scripts/run_behave_parallel.py --tags="@mocked" --junit-xml=reports/behave-windows.xml
      - name: Upload Windows Coverage Shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: coverage-shard-windows
          include-hidden-files: true
          path: .coverage
          retention-days: 7

  combined-coverage:
    name: combined-coverage
    needs: [pytest-suite, pytest-windows]
    if: always() && needs.pytest-suite.result == 'success' && needs.pytest-windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-ci
      - name: Download Linux Coverage Shard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-shard-ubuntu
          path: coverage-shards/ubuntu
      - name: Download Windows Coverage Shard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-shard-windows
          path: coverage-shards/windows
      - name: Combine Dual-OS Coverage & Enforce >= 90%
        run: |
          uv run python -m coverage combine --keep coverage-shards/ubuntu/.coverage coverage-shards/windows/.coverage
          uv run python -m coverage xml -o coverage-combined.xml
          uv run python -m coverage report --fail-under=90
      - name: Upload Combined Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: coverage-report
          path: coverage-combined.xml
          retention-days: 7

  qa-deep-fanout:
    name: qa-deep-fanout
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: deep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-ci
      - name: Run Deep Hypothesis Fuzz Suites
        run: uv run python scripts/run_pytest_clean.py -m fuzz -q
      - name: Run Python AST Mutation Sweep
        run: uv run python scripts/run_python_mutants.py --workers 4 --max-per-file 12 --min-kill-rate 85 --json-report reports/python-mutants.json
      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: python-mutation-report
          path: reports/python-mutants.json
          retention-days: 7

  rust-checks:
    name: rust-checks
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYO3_PYTHON: python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: brandon-fox/.github/.github/actions/setup-rust-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          python-version: '3.12'
          workspaces: crates/alos_native
      - name: Rust Format, Clippy & Native Proptest Suite
        run: |
          cargo fmt --manifest-path crates/alos_native/Cargo.toml -- --check
          cargo clippy --manifest-path crates/alos_native/Cargo.toml --no-default-features -- -D warnings
          cargo test --manifest-path crates/alos_native/Cargo.toml --no-default-features
      - name: Rust Advisories, Licenses & Bans Audit (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          manifest-path: crates/alos_native/Cargo.toml

  rust-windows:
    name: rust-windows
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYO3_PYTHON: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: brandon-fox/.github/.github/actions/setup-rust-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          python-version: '3.12'
          workspaces: crates/alos_native
      - name: Rust Windows Format, Clippy & Proptest Suite
        run: |
          cargo fmt --manifest-path crates/alos_native/Cargo.toml -- --check
          cargo clippy --manifest-path crates/alos_native/Cargo.toml --no-default-features -- -D warnings
          cargo test --manifest-path crates/alos_native/Cargo.toml --no-default-features

  rust-native-parity-and-mutants:
    name: rust-native-parity-and-mutants
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: brandon-fox/.github/.github/actions/setup-rust-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          python-version: '3.12'
          workspaces: crates/alos_native
      - uses: ./.github/actions/setup-python-ci
      - name: Build Native Wheel, Isolated Import Smoke & Differential Fuzzing
        run: |
          set -euo pipefail
          shopt -s nullglob
          uv run maturin build --manifest-path crates/alos_native/Cargo.toml --release --out dist-wheel
          wheels=(dist-wheel/*.whl)
          WHEEL_FILE="${wheels[0]}"
          uv run --isolated --no-project --with "$WHEEL_FILE" python -c "import alos_native; assert alos_native.FastSafetyEvaluator().classify_risk('web_search') == 'LOW'"
          uv pip install "$WHEEL_FILE"
          uv run python scripts/run_pytest_clean.py tests/test_rust_native_bridge.py tests/test_rust_native_parity.py tests/test_fuzz_properties.py
      - name: Install precompiled cargo-mutants and cargo-nextest
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-mutants,cargo-nextest
      - name: Run cargo-mutants
        run: cargo mutants --manifest-path crates/alos_native/Cargo.toml --jobs 4

  dependency-review:
    name: dependency-review
    needs: [changes]
    if: github.event_name == 'pull_request' && (needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency Review (Strict License & CVE Gate)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          allow-licenses: 'MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, Python-2.0, Unlicense, 0BSD, MPL-2.0, CC0-1.0, LGPL-2.1-or-later, LGPL-3.0-or-later, BSD-3-Clause-Clear'

  docker-validate:
    name: docker-validate
    needs: [changes]
    if: needs.changes.outputs.docker == 'true' || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-ci
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Trivy Vulnerability & Config Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build sandbox base image (scoped BuildKit cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.sandbox
          target: base
          load: true
          tags: alos-sandbox:ci
          cache-from: type=gha,scope=alos-sandbox-base
          cache-to: type=gha,mode=max,scope=alos-sandbox-base
      - name: Build sandbox full image (scoped BuildKit cache)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.sandbox
          target: full
          push: false
          tags: alos-sandbox:full
          cache-from: type=gha,scope=alos-sandbox-full
          cache-to: type=gha,mode=max,scope=alos-sandbox-full
      - name: Run container isolation tests against real runtime
        env:
          ALOS_SANDBOX_IMAGE: alos-sandbox:ci
          ALOS_SANDBOX_REQUIRED: "1"
        run: uv run pytest tests/test_swarm_sandbox.py -m docker

  ci-merge-gate:
    name: ci-merge-gate
    if: always()
    needs:
      - pr-size
      - pr-governance
      - changes
      - python-static
      - pytest-suite
      - pytest-windows
      - combined-coverage
      - qa-deep-fanout
      - rust-checks
      - rust-windows
      - rust-native-parity-and-mutants
      - dependency-review
      - docker-validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate all upstream CI lanes (zero upstream-failure skip bypass)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - << 'PY'
          import json, os, sys

          needs = json.loads(os.environ["NEEDS_JSON"])
          event = os.environ["EVENT_NAME"]
          outputs = needs.get("changes", {}).get("outputs", {})
          py_active = outputs.get("python") == "true" or event != "pull_request"
          docs_active = outputs.get("docs") == "true" or py_active
          rust_active = outputs.get("rust") == "true" or event != "pull_request"
          docker_active = outputs.get("docker") == "true" or event != "pull_request"

          errors = []
          for req in ("pr-governance", "changes"):
              if needs.get(req, {}).get("result") != "success":
                  errors.append(f"{req}={needs.get(req, {}).get('result')}")

          if event == "pull_request" and needs.get("pr-size", {}).get("result") != "success":
              errors.append(f"pr-size={needs.get('pr-size', {}).get('result')}")

          for name, info in sorted(needs.items()):
              res = info.get("result")
              if res in ("failure", "cancelled", "timed_out"):
                  errors.append(f"{name}={res}")

          active_required = []
          if docs_active:
              active_required.append("python-static")
          if py_active:
              active_required.extend(["combined-coverage", "qa-deep-fanout"])
          if rust_active:
              active_required.extend(["rust-checks", "rust-windows", "rust-native-parity-and-mutants"])
          if docker_active:
              active_required.append("docker-validate")

          for lane in active_required:
              if needs.get(lane, {}).get("result") != "success":
                  errors.append(f"{lane}={needs.get(lane, {}).get('result')}")

          if errors:
              print("::error::ci-merge-gate failed due to upstream lane(s): " + ", ".join(dict.fromkeys(errors)))
              sys.exit(1)
          print("ci-merge-gate: all active verification lanes passed.")
          PY
