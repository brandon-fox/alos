# This workflow runs a comprehensive parallel quality gate for the ALOS project.
# It includes path filtering to isolate Python checks from Rust-only changes,
# optimized uv dependency caching, and open-source ML model weight caching (up to 2GB).

name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            python:
              - 'alos/**'
              - 'tests/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'alembic/**'
              - 'alembic.ini'
              - '.github/workflows/quality-gate.yml'
            rust:
              - 'crates/**'
              - 'Cargo.lock'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*'

  uv-lock-check:
    name: uv-lock-check
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Verify uv.lock Sync
        run: uv lock --check

  ruff-lint:
    name: ruff-lint
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Ruff Lint
        run: uv run ruff check alos tests
      - name: Ruff Format Check
        run: uv run ruff format --check alos tests

  mypy-types:
    name: mypy-types
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: MyPy Static Analysis
        run: uv run mypy alos

  bandit-security:
    name: bandit-security
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Bandit Security Scan
        run: uv run bandit -r alos -s B101 -f json -o bandit-report.json || true
      - name: Bandit Human Report
        run: uv run bandit -r alos -s B101

  pytest-suite:
    name: pytest-suite
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Cache Open Source AI Model Weights (Up to 2GB)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub
          key: ${{ runner.os }}-model-weights-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-model-weights-
      - name: Run Tests with Coverage
        run: uv run pytest --cov=alos --cov-report=xml:coverage.xml --cov-report=term-missing
      - name: Upload Coverage Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  adr-governance:
    name: adr-governance
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Verify ADR Repository
        run: uv run pyadr check-adr-repo

  dependency-review:
    name: dependency-review
    needs: [changes]
    if: github.event_name == 'pull_request' && (needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        continue-on-error: true
        with:
          comment-summary-in-pr: always
          allow-licenses: 'MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, Python-2.0, Unlicense, 0BSD, MPL-2.0, CC0-1.0, LGPL-2.1-or-later, LGPL-3.0-or-later, BSD-3-Clause-Clear'

  docker-validate:
    name: docker-validate
    needs: [changes]
    if: needs.changes.outputs.docker == 'true' || contains(github.event.head_commit.message, 'docker') || contains(github.event.head_commit.message, 'compose')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'

  crewai-validation:
    name: crewai-validation
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Cache Open Source AI Model Weights (Up to 2GB)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface/hub
            ~/.cache/torch/hub
          key: ${{ runner.os }}-model-weights-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            ${{ runner.os }}-model-weights-
      - name: Validate CrewAI Local Setup
        run: uv run pytest tests/test_crewai_local.py
