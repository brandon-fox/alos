# This workflow runs a comprehensive parallel quality gate for the ALOS project.
# It includes path filtering to isolate Python checks from Rust-only changes,
# dual-OS (ubuntu-latest + windows-latest) execution with combined coverage,
# and heavy compute fan-out (deep Hypothesis fuzzing + AST mutation testing).

name: Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-size:
    if: github.event_name == 'pull_request'
    uses: brandon-fox/.github/.github/workflows/pr-size-guard.yml@093fbcf217975354790f21e30f7ce4e4061d35c2 # main

  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      python: ${{ steps.filter.outputs.python }}
      rust: ${{ steps.filter.outputs.rust }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3.0.2
        id: filter
        with:
          filters: |
            python:
              - 'alos/**'
              - 'tests/**'
              - 'features/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - 'alembic/**'
              - 'alembic.ini'
              - '.github/workflows/quality-gate.yml'
            rust:
              - 'crates/**'
              - 'Cargo.lock'
            docker:
              - 'Dockerfile*'
              - 'docker-compose*'

  uv-lock-check:
    name: uv-lock-check
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          sync: 'false'
      - name: Verify uv.lock Sync
        run: uv lock --check

  ruff-lint:
    name: ruff-lint
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Ruff Lint
        run: uv run ruff check alos tests features scripts
      - name: Ruff Format Check
        run: uv run ruff format --check alos tests features scripts

  mypy-types:
    name: mypy-types
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: MyPy Static Analysis
        run: uv run mypy alos tests features scripts

  bandit-security:
    name: bandit-security
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Bandit Security Scan
        run: uv run bandit -r alos -s B101 -f json -o bandit-report.json || true
      - name: Bandit Human Report
        run: uv run bandit -r alos -s B101

  pytest-suite:
    name: pytest-suite
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - uses: brandon-fox/.github/.github/actions/cache-ml-weights@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Run Parallel Tests with Branch Coverage (Linux)
        # Floor raised to 90% from 85% (Spec 035). Never lower to make a PR pass.
        run: uv run python scripts/run_pytest_clean.py --keep-coverage --cov=alos --cov-report=xml:coverage.xml --cov-report=term-missing --cov-fail-under=90
      - name: Run Parallel Mocked Behave BDD Suite (Linux)
        run: uv run python scripts/run_behave_parallel.py --tags="@mocked" --junit-xml=reports/behave-linux.xml
      - name: Upload Linux Coverage Shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: coverage-shard-ubuntu
          path: |
            .coverage
            coverage.xml
          retention-days: 7

  pytest-windows:
    name: pytest-windows
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Run Parallel Tests with Branch Coverage (Windows)
        run: uv run python scripts/run_pytest_clean.py --keep-coverage --cov=alos --cov-report=term-missing --cov-fail-under=90
      - name: Run Parallel Mocked Behave BDD Suite (Windows)
        run: uv run python scripts/run_behave_parallel.py --tags="@mocked" --junit-xml=reports/behave-windows.xml
      - name: Upload Windows Coverage Shard
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: coverage-shard-windows
          path: .coverage
          retention-days: 7

  combined-coverage:
    name: combined-coverage
    needs: [pytest-suite, pytest-windows]
    if: always() && needs.pytest-suite.result == 'success' && needs.pytest-windows.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Download Linux Coverage Shard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-shard-ubuntu
          path: coverage-shards/ubuntu
      - name: Download Windows Coverage Shard
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-shard-windows
          path: coverage-shards/windows
      - name: Combine Dual-OS Coverage & Enforce >= 90%
        run: |
          uv run python -m coverage combine --keep coverage-shards/ubuntu/.coverage coverage-shards/windows/.coverage
          uv run python -m coverage xml -o coverage-combined.xml
          uv run python -m coverage report --fail-under=90
      - name: Upload Combined Coverage Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: coverage-report
          path: coverage-combined.xml
          retention-days: 7

  qa-deep-fanout:
    name: qa-deep-fanout
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HYPOTHESIS_PROFILE: deep
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Run Deep Hypothesis Fuzz Suites (Offloaded to CI)
        run: uv run python scripts/run_pytest_clean.py -m fuzz -q
      - name: Run Python AST Mutation Sweep (Offloaded to CI)
        run: uv run python scripts/run_python_mutants.py --workers 4 --max-per-file 12 --min-kill-rate 85 --json-report reports/python-mutants.json
      - name: Upload Mutation Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: python-mutation-report
          path: reports/python-mutants.json
          retention-days: 7

  adr-governance:
    name: adr-governance
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Verify ADR Repository
        run: uv run pyadr check-adr-repo

  dependency-review:
    name: dependency-review
    needs: [changes]
    if: github.event_name == 'pull_request' && (needs.changes.outputs.python == 'true' || needs.changes.outputs.rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        continue-on-error: true
        with:
          comment-summary-in-pr: always
          allow-licenses: 'MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, PSF-2.0, Python-2.0, Unlicense, 0BSD, MPL-2.0, CC0-1.0, LGPL-2.1-or-later, LGPL-3.0-or-later, BSD-3-Clause-Clear'

  action-pins-exist:
    name: action-pins-exist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every pinned action commit must exist upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          grep -rhoE 'us[e]s: +[A-Za-z0-9_.-]+/[A-Za-z0-9_./-]+@[0-9a-f]{40}' .github/workflows \
            | sed -E 's/^[a-z]+: +//' | sort -u > pins.txt
          missing=0
          while IFS='@' read -r action sha; do
            repo=$(echo "$action" | cut -d/ -f1-2)
            if ! gh api "repos/${repo}/git/commits/${sha}" --silent 2>/dev/null; then
              echo "::error::${action}@${sha} does not exist in ${repo}"
              missing=1
            fi
          done < pins.txt
          echo "checked $(wc -l < pins.txt) pinned actions"
          exit "$missing"

  docker-validate:
    name: docker-validate
    needs: [changes]
    if: needs.changes.outputs.docker == 'true' || contains(github.event.head_commit.message, 'docker') || contains(github.event.head_commit.message, 'compose')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate Docker Compose
        run: docker compose config --quiet
      - name: Trivy IaC Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true
          exit-code: '1'

  crewai-validation:
    name: crewai-validation
    needs: [changes]
    if: needs.changes.outputs.python == 'true' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - uses: brandon-fox/.github/.github/actions/cache-ml-weights@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Validate CrewAI Local Setup
        run: uv run pytest tests/test_crewai_local.py
