name: Post-Merge Analysis Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_run:
    workflows: ["Auto Merge"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: post-merge-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup uv (cached)
        uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main

      - name: Run pytest with coverage XML
        run: uv run pytest --cov=alos --cov-report=xml:coverage.xml -q || true

      - name: SonarCloud Scan
        # Advisory until SONAR_TOKEN / organization key is renewed (tracked under Needs Brandon in #104).
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.organization=${{ vars.SONAR_ORG || 'brandon-fox' }}

  complexity-scan:
    name: Complexity Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv (cached)
        uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          sync: 'false'

      - name: Run Complexity Scanner
        id: scan
        run: |
          uv run --no-project --with radon python .github/scripts/complexity_scanner.py > complexity_report.txt || true
          COUNT=$(wc -l < complexity_report.txt || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Issue
        if: steps.scan.outputs.count > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.scan.outputs.count }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          TITLE="🧮 Complexity Report: $COUNT lines ($DATE)"

          EXISTING_ISSUE=$(gh issue list --label "automated" --search "Complexity Report: in:title" --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body-file complexity_report.txt
          else
            gh issue create --title "$TITLE" --body-file complexity_report.txt --label "automated"
          fi

  coverage-gap:
    name: Coverage Gap Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv (cached)
        uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main

      - name: Run pytest with JSON coverage
        run: uv run pytest --cov=alos --cov-report=json:coverage.json --cov-report=term-missing -q || true

      - name: Run Coverage Gap Analyzer
        run: python .github/scripts/coverage_gap_analyzer.py || true

      - uses: ./.github/actions/setup-git-signing
        with:
          signing-key: ${{ secrets.COMMIT_SIGNING_KEY }}
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3.0.8.1.3
        with:
          token: ${{ secrets.PR_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
          commit-message: "chore(tests): add coverage gap test stubs"
          title: "chore(tests): automated coverage gap test stubs"
          branch: "chore/bot-coverage-gap"
          labels: "automated"
          delete-branch: true
          body: "Auto-generated coverage gap analysis and test stubs."

  audit-docstrings:
    name: Docstring Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run AST Docstring Audit
        id: audit
        run: |
          cat << 'EOF' > doc_audit.py
          import ast
          import os

          missing = []
          for root, _, files in os.walk('alos'):
              for file in files:
                  if not file.endswith('.py'): continue
                  path = os.path.join(root, file)
                  with open(path, 'r', encoding='utf-8') as f:
                      try: tree = ast.parse(f.read())
                      except: continue

                  if not ast.get_docstring(tree):
                      missing.append(f"Module: {path}")

                  for node in ast.walk(tree):
                      if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef)):
                          if not node.name.startswith('_') and not ast.get_docstring(node):
                              missing.append(f"{type(node).__name__}: {node.name} in {path}")

          with open('doc_report.txt', 'w', encoding='utf-8') as f:
              f.write('\n'.join(missing))

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"count={len(missing)}\n")
          EOF

          python doc_audit.py

      - name: Create or Update Issue
        if: steps.audit.outputs.count > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.audit.outputs.count }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          TITLE="📖 Docstring Audit: $COUNT missing docstrings ($DATE)"

          {
            echo '### Missing Docstrings'
            echo '```text'
            cat doc_report.txt
            echo '```'
          } > issue_body.txt

          EXISTING_ISSUE=$(gh issue list --label "documentation" --search "Docstring Audit: in:title" --state open --limit 1 --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body-file issue_body.txt
          else
            gh issue create --title "$TITLE" --body-file issue_body.txt --label "documentation,automated"
          fi

  spec-gap:
    name: Spec Gap Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Spec Gap Analyzer
        id: analyze
        run: |
          python .github/scripts/spec_gap_analyzer.py > spec_report.txt || true
          COUNT=$(wc -l < spec_report.txt || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Issue
        if: steps.analyze.outputs.count > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.analyze.outputs.count }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          TITLE="📐 Spec Gap Analysis: $COUNT lines ($DATE)"

          EXISTING_ISSUE=$(gh issue list --label "automated" --search "Spec Gap Analysis: in:title" --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body-file spec_report.txt
          else
            gh issue create --title "$TITLE" --body-file spec_report.txt --label "documentation,automated"
          fi

  harvest-todos:
    name: Tech Debt & TODO Harvester
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Scan for Tech Debt Markers
        id: scan
        run: |
          grep -rnE '(TODO|FIXME|HACK|XXX|NOSONAR):?\s' alos/ tests/ --include='*.py' > todo_report.txt || true
          COUNT=$(wc -l < todo_report.txt || echo 0)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Issue
        if: steps.scan.outputs.count > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.scan.outputs.count }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          TITLE="🔍 Tech Debt Scan: $COUNT markers found ($DATE)"

          {
            echo '### Tech Debt Markers Found'
            echo '```text'
            cat todo_report.txt
            echo '```'
          } > issue_body.txt

          EXISTING_ISSUE=$(gh issue list --label "automated" --search "Tech Debt Scan: in:title" --state open --limit 1 --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body-file issue_body.txt
          else
            gh issue create --title "$TITLE" --body-file issue_body.txt --label "automated"
          fi

  type-coverage:
    name: Type Coverage Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv (cached)
        uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main

      - name: Run mypy analysis
        run: uv run mypy alos --txt-report mypy_report || true

      - name: Find Low Coverage Files
        id: parse
        run: |
          if [ -f "mypy_report/index.txt" ]; then
            awk -F'|' 'NR>2 && $6 < 70.0 {print $1, $6}' mypy_report/index.txt > low_coverage.txt || true
            COUNT=$(wc -l < low_coverage.txt || echo 0)
          else
            COUNT=0
            touch low_coverage.txt
          fi
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Issue
        if: steps.parse.outputs.count > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COUNT: ${{ steps.parse.outputs.count }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          TITLE="🏷️ Type Coverage Report: $COUNT files below threshold ($DATE)"

          {
            echo '### Files with Type Coverage < 70%'
            echo '```text'
            cat low_coverage.txt
            echo '```'
          } > issue_body.txt

          EXISTING_ISSUE=$(gh issue list --label "automated" --search "Type Coverage Report: in:title" --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body-file issue_body.txt
          else
            gh issue create --title "$TITLE" --body-file issue_body.txt --label "automated"
          fi
