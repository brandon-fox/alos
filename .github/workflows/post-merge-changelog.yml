name: Post-Merge Changelog
on:
  push:
    branches: [ "main" ]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate Changelog
        run: |
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo '')
          if [ -z "$LAST_TAG" ]; then
            RANGE='HEAD'
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          echo '# Changelog' > CHANGELOG.md
          echo '' >> CHANGELOG.md
          echo "## Unreleased" >> CHANGELOG.md
          echo '' >> CHANGELOG.md

          # Features
          echo '### ✨ Features' >> CHANGELOG.md
          git log $RANGE --oneline --grep='^feat' --format='- %s (%h)' >> CHANGELOG.md || true
          echo '' >> CHANGELOG.md

          # Fixes
          echo '### 🐛 Fixes' >> CHANGELOG.md
          git log $RANGE --oneline --grep='^fix' --format='- %s (%h)' >> CHANGELOG.md || true
          echo '' >> CHANGELOG.md

          # Chores
          echo '### 🔧 Chores' >> CHANGELOG.md
          git log $RANGE --oneline --grep='^chore' --format='- %s (%h)' >> CHANGELOG.md || true

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "docs(changelog): auto-update changelog"
          title: "docs(changelog): auto-update changelog"
          branch: "chore/bot-changelog"
          labels: "documentation,automated"
          delete-branch: true
