name: Security & Compliance Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1' # Weekly Monday at 03:00 UTC

concurrency:
  group: security-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  id-token: write

jobs:
  gitleaks-scan:
    name: gitleaks-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@af92631526372d8bc9ecb9b8b0e77478051e94ca # ff98106e4c7b2bc287b24eaf42907196329070c7.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  scorecard-analysis:
    name: scorecard-analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - name: OpenSSF Scorecard Analysis
        uses: ossf/scorecard-action@62b44769829e3086106d3183df4c37a63795a672 # ff98106e4c7b2bc287b24eaf42907196329070c7.4.0
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true
        continue-on-error: true
      - name: Upload SARIF report
        uses: github/codeql-action/upload-sarif@4dd3e590013d420f188365f57ee1d89fa3ef0a22 # a2983b8bed1923f44751c5c43237f479442827b3.28.10
        with:
          sarif_file: scorecard-results.sarif
        continue-on-error: true

  codeql-analysis:
    name: codeql-analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['python']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@4dd3e590013d420f188365f57ee1d89fa3ef0a22 # a2983b8bed1923f44751c5c43237f479442827b3.28.10
        with:
          languages: ${{ matrix.language }}
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4dd3e590013d420f188365f57ee1d89fa3ef0a22 # a2983b8bed1923f44751c5c43237f479442827b3.28.10
