name: Spec Review Bot

on:
  pull_request:
    paths:
      - 'specs/**'
      - '.specify/memory/constitution.md'
      - '.github/workflows/spec-analyzer-bot.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-spec:
    name: Spec Review & Consistency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Perform Spec Analysis
        id: analyzer
        run: |
          cat << 'EOF' > spec_review.py
          import os, glob, re

          spec_dirs = glob.glob('specs/*/')
          report = []
          report.append("### 📐 SpecKit Specification Quality Audit")
          report.append("")

          if not spec_dirs:
              report.append("ℹ️ No feature specification directories found under `specs/`.")
          else:
              for s_dir in sorted(spec_dirs):
                  feature_name = os.path.basename(s_dir.rstrip('/'))
                  report.append(f"#### Feature: `{feature_name}`")

                  spec_file = os.path.join(s_dir, "spec.md")
                  plan_file = os.path.join(s_dir, "plan.md")
                  tasks_file = os.path.join(s_dir, "tasks.md")

                  spec_exists = os.path.isfile(spec_file)
                  plan_exists = os.path.isfile(plan_file)
                  tasks_exists = os.path.isfile(tasks_file)

                  report.append(f"- **Files**: `spec.md`: {'✅' if spec_exists else '❌'} | `plan.md`: {'✅' if plan_exists else '❌'} | `tasks.md`: {'✅' if tasks_exists else '❌'}")

                  if spec_exists:
                      with open(spec_file, 'r', encoding='utf-8') as f:
                          content = f.read()
                      fr_matches = re.findall(r'FR-\d+', content)
                      report.append(f"- **Requirements Traced**: {len(set(fr_matches))} unique requirement IDs ({', '.join(sorted(set(fr_matches))) if fr_matches else 'None found'})")

                  if tasks_exists:
                      with open(tasks_file, 'r', encoding='utf-8') as f:
                          t_content = f.read()
                      total_tasks = len(re.findall(r'- \[(?: |x)\]', t_content))
                      completed_tasks = len(re.findall(r'- \[x\]', t_content))
                      progress = f"{completed_tasks}/{total_tasks}" if total_tasks > 0 else "0/0"
                      report.append(f"- **Task Execution Progress**: {progress} tasks completed")
                  report.append("")

          report.append("\n*Automated report generated by Spec Review Bot.*")
          with open('spec_review_report.md', 'w', encoding='utf-8') as f:
              f.write('\n'.join(report))
          EOF

          python spec_review.py

      - name: Post or Update PR Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const bodyContent = fs.readFileSync('spec_review_report.md', 'utf8');
            const botTag = '<!-- spec-analyzer-bot-comment -->';
            const fullBody = `${botTag}\n${bodyContent}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment => comment.body && comment.body.includes(botTag));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: fullBody,
              });
              core.info(`Updated existing Spec Review comment ID: ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
              core.info(`Created new Spec Review comment on PR #${context.issue.number}`);
            }
