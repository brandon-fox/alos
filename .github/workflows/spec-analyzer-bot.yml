name: Spec Review Bot

on:
  pull_request:
    paths:
      - 'specs/**'
      - '.specify/memory/constitution.md'
      - '.github/workflows/spec-analyzer-bot.yml'
      - '.github/scripts/spec_review.py'

permissions:
  contents: read
  pull-requests: write

jobs:
  analyze-spec:
    name: Spec Review & Consistency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup uv
        uses: astral-sh/setup-uv@f943832d735fb2565cc5fa44b360df92b9514742 # v5.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Perform Spec Analysis
        id: analyzer
        run: uv run python .github/scripts/spec_review.py

      - name: Post or Update PR Comment
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdeb # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const bodyContent = fs.readFileSync('spec_review_report.md', 'utf8');
            const botTag = '<!-- spec-analyzer-bot-comment -->';
            const fullBody = `${botTag}\n${bodyContent}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find(comment => comment.body && comment.body.includes(botTag));

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body: fullBody,
              });
              core.info(`Updated existing Spec Review comment ID: ${existingComment.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
              core.info(`Created new Spec Review comment on PR #${context.issue.number}`);
            }
