name: Post-Merge Spec Gap Analysis
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write

concurrency:
  group: spec-gap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  spec-gap:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Spec Gap Analyzer
        id: analyze
        run: |
          python .github/scripts/spec_gap_analyzer.py > spec_report.txt || true
          COUNT=$(wc -l < spec_report.txt || echo 0)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue
        if: steps.analyze.outputs.count > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          COUNT=${{ steps.analyze.outputs.count }}
          TITLE="📐 Spec Gap Analysis: $COUNT gaps found ($DATE)"

          gh issue create --title "$TITLE" --body-file spec_report.txt --label "specs,automated,governance"
