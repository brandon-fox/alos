name: Rust CI Pipeline

on:
  # No path filter on pull requests: this is a required check, and a required check that
  # never reports blocks the merge.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'

concurrency:
  group: rust-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYO3_PYTHON: python3
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust & Python (cached)
        uses: brandon-fox/.github/.github/actions/setup-rust-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          python-version: '3.12'
          workspaces: crates/alos_native

      - name: Format Check
        run: cargo fmt --manifest-path crates/alos_native/Cargo.toml -- --check

      - name: Clippy Lint Scan
        run: cargo clippy --manifest-path crates/alos_native/Cargo.toml --no-default-features -- -D warnings

      - name: Run Native Unit & Proptest Suite
        run: cargo test --manifest-path crates/alos_native/Cargo.toml --no-default-features

  rust-windows:
    name: Rust Windows Checks
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYO3_PYTHON: python
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust & Python (cached)
        uses: brandon-fox/.github/.github/actions/setup-rust-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          python-version: '3.12'
          workspaces: crates/alos_native

      - name: Format Check
        run: cargo fmt --manifest-path crates/alos_native/Cargo.toml -- --check

      - name: Clippy Lint Scan
        run: cargo clippy --manifest-path crates/alos_native/Cargo.toml --no-default-features -- -D warnings

      - name: Run Native Unit & Proptest Suite (Windows)
        run: cargo test --manifest-path crates/alos_native/Cargo.toml --no-default-features

  rust-native-parity-and-mutants:
    name: Rust PyO3 Parity & cargo-mutants
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust & Python (cached)
        uses: brandon-fox/.github/.github/actions/setup-rust-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          python-version: '3.12'
          workspaces: crates/alos_native

      - name: Setup uv Dependencies
        uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main

      - name: Build Native Extension & Run Python-vs-Rust Differential Fuzzing
        run: |
          uv run maturin develop --manifest-path crates/alos_native/Cargo.toml --release
          uv run python scripts/run_pytest_clean.py tests/test_rust_native_bridge.py tests/test_rust_native_parity.py tests/test_fuzz_properties.py

      - name: Install & Run cargo-mutants
        run: |
          cargo install --locked cargo-mutants
          cargo mutants --manifest-path crates/alos_native/Cargo.toml --jobs 4
