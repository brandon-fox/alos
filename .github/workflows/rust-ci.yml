name: Rust CI Pipeline

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'

concurrency:
  group: rust-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ff98106e4c7b2bc287b24eaf42907196329070c7.7.7
        with:
          workspaces: crates/alos_native

      - name: Format Check
        run: cargo fmt --manifest-path crates/alos_native/Cargo.toml -- --check

      - name: Clippy Lint Scan
        run: cargo clippy --manifest-path crates/alos_native/Cargo.toml -- -D warnings

      - name: Run Native Unit Tests
        run: cargo test --manifest-path crates/alos_native/Cargo.toml
