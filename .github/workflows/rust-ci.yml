name: Rust CI Pipeline

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'

concurrency:
  group: rust-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust Code Quality & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@a27d2c4314c449339e7616c68a48b50259b15239 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@f0deed1e0edfc6a9beeee541004cd3f707f3e8f7 # v2.7.7
        with:
          workspaces: crates/alos_native

      - name: Format Check
        run: cargo fmt --manifest-path crates/alos_native/Cargo.toml -- --check

      - name: Clippy Lint Scan
        run: cargo clippy --manifest-path crates/alos_native/Cargo.toml -- -D warnings

      - name: Run Native Unit Tests
        run: cargo test --manifest-path crates/alos_native/Cargo.toml
