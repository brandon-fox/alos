name: Rust CI Pipeline

on:
  # No path filter on pull requests: this is a required check, and a required check that
  # never reports blocks the merge.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'Cargo.lock'
      - '.github/workflows/rust-ci.yml'

concurrency:
  group: rust-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-checks:
    name: Rust Code Quality & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYO3_PYTHON: python3
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Python 3.12 for PyO3
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust Dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.7.7
        with:
          workspaces: crates/alos_native

      - name: Format Check
        run: cargo fmt --manifest-path crates/alos_native/Cargo.toml -- --check

      - name: Clippy Lint Scan
        run: cargo clippy --manifest-path crates/alos_native/Cargo.toml -- -D warnings

      - name: Run Native Unit Tests
        run: cargo test --manifest-path crates/alos_native/Cargo.toml --no-default-features
