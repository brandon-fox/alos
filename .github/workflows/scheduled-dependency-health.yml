name: Scheduled Dependency Health

on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

jobs:
  dependency-health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@423742b619a37d5073499d7845f942501a92a54e # v5.4.0
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.3.0
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run pip-audit
        run: |
          uv pip compile pyproject.toml -o requirements.txt
          pip install pip-audit
          pip-audit -r requirements.txt --format json --output pip_audit.json || true

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH,MEDIUM'
          exit-code: '0'

      - name: Check pip-audit results and create issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('pip_audit.json')) {
              try {
                const auditData = JSON.parse(fs.readFileSync('pip_audit.json', 'utf8'));
                if (auditData.dependencies) {
                  const vulnerabilities = auditData.dependencies.filter(dep => dep.vulns && dep.vulns.length > 0);
                  if (vulnerabilities.length > 0) {
                    const date = new Date().toISOString().split('T')[0];
                    const body = `## Dependency Vulnerabilities Found\n\n` +
                                 `The following vulnerabilities were found during the automated dependency health check:\n\n` +
                                 `\`\`\`json\n${JSON.stringify(vulnerabilities, null, 2)}\n\`\`\``;
                    await github.rest.issues.create({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      title: `🔐 Dependency Health Report (${date})`,
                      body: body,
                      labels: ['security', 'dependencies', 'automated']
                    });
                  }
                }
              } catch (e) {
                console.error("Error parsing pip-audit results:", e);
              }
            }
