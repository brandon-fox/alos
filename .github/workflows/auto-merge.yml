name: Auto Merge

# Trigger on every check_run completion so we re-evaluate after each quality gate
# job finishes, and on PR events for label/draft state changes.
on:
  pull_request:
    types:
      - labeled
      - unlabeled
      - synchronize
      - opened
      - reopened
      - ready_for_review
  check_run:
    types:
      - completed

jobs:
  automerge:
    name: Auto Merge Human PRs
    runs-on: ubuntu-latest
    # Skip bots — they have their own job below
    if: |
      github.actor != 'dependabot[bot]' &&
      github.actor != 'github-actions[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check PR eligibility
        id: check
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            // Resolve PR number. check_run events don't carry it directly —
            // match by head SHA against open PRs.
            let prNumber = context.payload.pull_request?.number;

            if (!prNumber && context.payload.check_run) {
              const sha = context.payload.check_run.head_sha;
              const { data: prs } = await github.rest.pulls.list({
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 50,
              });
              const match = prs.find(pr => pr.head.sha === sha);
              if (!match) {
                core.info('No open PR found for this check_run SHA — skipping.');
                return '';
              }
              prNumber = match.number;
            }

            if (!prNumber) {
              core.info('Could not resolve PR number — skipping.');
              return '';
            }

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const labels = pr.labels.map(l => l.name);

            // Block if any hold label is present — auto-merge is the default
            const holdLabels = ['wip', 'do-not-merge'];
            const blocked = holdLabels.filter(l => labels.includes(l));
            if (blocked.length > 0) {
              core.info(`PR #${prNumber} is blocked by label(s): ${blocked.join(', ')} — skipping.`);
              return '';
            }

            if (pr.draft) {
              core.info(`PR #${prNumber} is a draft — skipping.`);
              return '';
            }

            core.info(`PR #${prNumber} is eligible for auto-merge.`);
            return String(prNumber);

      - name: Enable auto-merge (waits for all required status checks)
        if: steps.check.outputs.result != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.check.outputs.result }}
        run: |
          gh pr merge "$PR_NUMBER" \
            --auto \
            --squash \
            --repo "${{ github.repository }}"

  dependabot-automerge:
    name: Auto Merge Dependabot PRs
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]' && github.event_name == 'pull_request'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Approve and enable auto-merge for minor/patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr review --approve "$PR_URL"
          gh pr merge --auto --squash "$PR_URL"
