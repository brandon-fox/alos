name: Auto Merge

# Enable squash auto-merge for all eligible PRs (Drafts, Dependabot, bots, humans)
# and keep PR branches rebased onto main with SSH-signed commits on every update.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft, labeled, unlabeled]
  check_run:
    types: [completed]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: auto-merge-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.check_run.head_sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'check_run' }}

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    name: Universal Auto Merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request' || github.event_name == 'check_run'
    steps:
      - name: Mark draft ready and enable squash auto-merge
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        env:
          GH_TOKEN: ${{ secrets.PR_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          script: |
            let prNumber = context.payload.pull_request?.number;
            if (!prNumber && context.payload.check_run) {
              const { data: prs } = await github.rest.pulls.list({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 50 });
              prNumber = prs.find(p => p.head.sha === context.payload.check_run.head_sha)?.number;
            }
            if (!prNumber) return;
            const repoSlug = `${context.repo.owner}/${context.repo.repo}`;
            const { data: pr } = await github.rest.pulls.get({ owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber });
            if (pr.state !== 'open') return;
            const labels = (pr.labels || []).map(l => l.name);
            if (labels.includes('wip') || labels.includes('do-not-merge')) return;
            if (pr.draft) await exec.exec('gh', ['pr', 'ready', String(prNumber), '--repo', repoSlug]);
            if (pr.user?.login === 'dependabot[bot]') {
              await exec.exec('gh', ['pr', 'review', '--approve', String(prNumber), '--repo', repoSlug], { ignoreReturnCode: true });
            }
            if (!pr.auto_merge) {
              const mode = pr.mergeable_state === 'clean' ? [] : ['--auto'];
              await exec.exec('gh', ['pr', 'merge', String(prNumber), ...mode, '--squash', '--delete-branch', '--repo', repoSlug]);
            }

  signed-rebase-on-update:
    name: Signed Rebase on PR Update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.event_name == 'pull_request' &&
      contains(fromJSON('["opened","reopened","synchronize","ready_for_review"]'), github.event.action) &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'wip') &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-merge')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
      - id: signing
        uses: ./.github/actions/setup-git-signing
        with:
          signing-key: ${{ secrets.COMMIT_SIGNING_KEY }}
      - id: rebase
        env:
          GH_TOKEN: ${{ secrets.PR_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/signed_pr_rebase.py --mode single \
            --base-branch "${{ github.event.pull_request.base.ref }}" \
            --head-branch "${{ github.event.pull_request.head.ref }}" \
            --signing-configured "${{ steps.signing.outputs.configured }}"
      - if: steps.rebase.outputs.status == 'conflict'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const tag = '<!-- auto-rebase-conflict-comment -->';
            const body = `${tag}\n⚠️ **Automatic Signed Rebase Paused**: Merge conflicts with \`${{ github.event.pull_request.base.ref }}\`. Resolve locally with signed commits and push.`;
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find(c => c.body && c.body.includes(tag));
            if (existing) await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });

  rebase-queue:
    name: Signed Rebase Queue & Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Sweep open PRs for draft-ready and auto-merge
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        env:
          GH_TOKEN: ${{ secrets.PR_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          script: |
            const repoSlug = `${context.repo.owner}/${context.repo.repo}`;
            const prs = await github.paginate(github.rest.pulls.list, { owner: context.repo.owner, repo: context.repo.repo, state: 'open', base: 'main', per_page: 50 });
            for (const pr of prs) {
              if ((pr.labels || []).some(l => l.name === 'wip' || l.name === 'do-not-merge')) continue;
              if (pr.draft) await exec.exec('gh', ['pr', 'ready', String(pr.number), '--repo', repoSlug]);
              if (pr.user?.login === 'dependabot[bot]') await exec.exec('gh', ['pr', 'review', '--approve', String(pr.number), '--repo', repoSlug], { ignoreReturnCode: true });
              if (!pr.auto_merge) await exec.exec('gh', ['pr', 'merge', String(pr.number), '--auto', '--squash', '--delete-branch', '--repo', repoSlug], { ignoreReturnCode: true });
            }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.PR_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
      - id: signing
        uses: ./.github/actions/setup-git-signing
        with:
          signing-key: ${{ secrets.COMMIT_SIGNING_KEY }}
      - env:
          GH_TOKEN: ${{ secrets.PR_QUEUE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python3 .github/scripts/signed_pr_rebase.py --mode queue --base-branch main --signing-configured "${{ steps.signing.outputs.configured }}"
