name: Post-Merge Complexity Scan
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write

concurrency:
  group: complexity-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  complexity-scan:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Radon
        run: pip install radon

      - name: Run Complexity Scanner
        id: scan
        run: |
          python .github/scripts/complexity_scanner.py > complexity_report.txt || true
          COUNT=$(wc -l < complexity_report.txt || echo 0)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Create GitHub Issue
        if: steps.scan.outputs.count > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          COUNT=${{ steps.scan.outputs.count }}
          TITLE="🧮 Complexity Report: $COUNT hotspots ($DATE)"

          gh issue create --title "$TITLE" --body-file complexity_report.txt --label "refactoring,automated,code-health"
