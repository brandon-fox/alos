name: Scheduled Matrix Test

on:
  schedule:
    - cron: '23 0 * * 0'
  workflow_dispatch:

concurrency:
  group: scheduled-matrix-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  matrix-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv & Python (cached)
        uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: uv run pytest

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.0.1
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🐍 Python Compatibility Failure: ${{ matrix.python-version }} (${date})`,
              body: `The automated matrix tests failed for Python ${{ matrix.python-version }}. Please check the workflow run for more details:\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['compatibility', 'automated']
            });
