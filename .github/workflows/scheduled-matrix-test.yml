name: Scheduled Matrix Test

on:
  schedule:
    - cron: '23 0 * * 0'
  workflow_dispatch:

concurrency:
  group: scheduled-matrix-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  matrix-test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13']
    env:
      HYPOTHESIS_PROFILE: deep
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup uv & Python (cached)
        uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run Parallel Pytest & Deep Hypothesis Fuzzing
        run: uv run python scripts/run_pytest_clean.py --keep-coverage --cov=alos --cov-report=term-missing --cov-fail-under=90

      - name: Run Parallel Mocked Behave Suite
        run: uv run python scripts/run_behave_parallel.py --tags="@mocked"

      - name: Upload Matrix Coverage Shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4.6.0
        with:
          name: matrix-cov-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .coverage
          retention-days: 7

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7.0.1
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Python/OS Matrix Failure: ${{ matrix.os }} / Python ${{ matrix.python-version }} (${date})`,
              body: `The automated dual-OS matrix tests failed on ${{ matrix.os }} (Python ${{ matrix.python-version }}). Please check the workflow run for more details:\n\n${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['compatibility', 'automated']
            });
