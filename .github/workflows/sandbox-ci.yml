# Proves the draft-test sandbox against a real container runtime on every pull request.
# The unit tests in the quality gate check the command line; only this job shows that a
# hostile draft cannot write to the repository or reach the network.
# Spec: specs/030-swarm-test-sandbox/spec.md

name: Sandbox CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: sandbox-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sandbox-isolation:
    name: sandbox-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the sandbox image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.sandbox
          target: base
          load: true
          tags: alos-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the isolation tests against real containers
        env:
          ALOS_SANDBOX_IMAGE: alos-sandbox:ci
          # A missing image must fail this job, not skip its tests.
          ALOS_SANDBOX_REQUIRED: "1"
        run: uv run pytest tests/test_swarm_sandbox.py -m docker
