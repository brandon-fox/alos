# Proves the draft-test sandbox against a real container runtime on every pull request.
# The unit tests in the quality gate check the command line; only this job shows that a
# hostile draft cannot write to the repository or reach the network.
# Spec: specs/030-swarm-test-sandbox/spec.md

name: Sandbox CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: sandbox-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  sandbox-isolation:
    name: sandbox-isolation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.3.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Build the sandbox image
        run: docker build --file Dockerfile.sandbox --target base --tag alos-sandbox:ci .
      - name: Run the isolation tests against real containers
        env:
          ALOS_SANDBOX_IMAGE: alos-sandbox:ci
          # A missing image must fail this job, not skip its tests.
          ALOS_SANDBOX_REQUIRED: "1"
        run: uv run pytest tests/test_swarm_sandbox.py -m docker
