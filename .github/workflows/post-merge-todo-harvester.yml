name: Post-Merge TODO Harvester
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  issues: write

concurrency:
  group: todo-harvester-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harvest-todos:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]' && github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Scan for Tech Debt Markers
        id: scan
        run: |
          grep -rnE '(TODO|FIXME|HACK|XXX|NOSONAR):?\s' alos/ tests/ --include='*.py' > todo_report.txt || true
          COUNT=$(wc -l < todo_report.txt)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Issue
        if: steps.scan.outputs.count > 0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATE=$(date +'%Y-%m-%d')
          COUNT=${{ steps.scan.outputs.count }}
          TITLE="🔍 Tech Debt Scan: $COUNT markers found ($DATE)"

          echo '### Tech Debt Markers Found' > issue_body.txt
          echo '```text' >> issue_body.txt
          cat todo_report.txt >> issue_body.txt
          echo '```' >> issue_body.txt

          EXISTING_ISSUE=$(gh issue list --label "tech-debt" --state open --limit 1 --json number --jq '.[0].number')

          if [ -n "$EXISTING_ISSUE" ]; then
            gh issue comment "$EXISTING_ISSUE" --body-file issue_body.txt
          else
            gh issue create --title "$TITLE" --body-file issue_body.txt --label "tech-debt,automated"
          fi
