name: Release & Packaging Pipeline

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches: [main]
    paths:
      - 'alos/**'
      - 'crates/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-python-wheel:
    name: build-python-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.3.0
        with:
          enable-cache: true
      - name: Build Python Package Artifacts
        run: uv build
      - name: Verify Package Metadata
        run: |
          uv sync --extra dev
          uv run twine check dist/*
      - name: Upload Python Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: python-dist
          path: dist/
          retention-days: 7

  build-rust-binary:
    name: build-rust-binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # ff98106e4c7b2bc287b24eaf42907196329070c7.7.7
        with:
          workspaces: crates/alos_native
      - name: Build Release Binary
        run: cargo build --manifest-path crates/alos_native/Cargo.toml --release
      - name: Upload Rust Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: rust-native-release
          path: crates/alos_native/target/release/
          retention-days: 7

  docker-build-publish-dryrun:
    name: docker-build-publish-dryrun
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b4ef4073d4d5183156012697 # a2983b8bed1923f44751c5c43237f479442827b3.10.0
      - name: Build Docker Container Image (Dry Run)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c53b6d655a # v6.15.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: alos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@f325610c36087b27ed3158c381f21568297b864a # v0.18.0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
        continue-on-error: true

  auto-release-notes:
    name: auto-release-notes
    needs: [build-python-wheel, build-rust-binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          fetch-depth: 0
      - name: Generate Release Notes Draft
        uses: softprops/action-gh-release@c95fe0f22566c81ce4e67b036f851eb11b6a6c6e # ff98106e4c7b2bc287b24eaf42907196329070c7.2.1
        with:
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
