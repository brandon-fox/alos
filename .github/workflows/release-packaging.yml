name: Release & Packaging Pipeline

on:
  push:
    tags:
      - 'v*'
  # No path filter on pull requests: the build jobs are required checks, and a required
  # check that never reports blocks the merge.
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-python-wheel:
    name: build-python-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          sync: 'false'
      - name: Build Python Package Artifacts
        run: uv build
      - name: Verify Package Metadata
        run: |
          uv sync --frozen --extra dev
          uv run twine check dist/*
      - name: Upload Python Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: python-dist
          path: dist/
          retention-days: 7

  build-rust-binary:
    name: build-rust-binary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYO3_PYTHON: python3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust & Python (cached)
        uses: brandon-fox/.github/.github/actions/setup-rust-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          python-version: '3.12'
          workspaces: crates/alos_native
      - name: Build Release Binary
        run: cargo build --manifest-path crates/alos_native/Cargo.toml --release
      - name: Upload Rust Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.0
        with:
          name: rust-native-release
          path: crates/alos_native/target/release/
          retention-days: 7

  docker-build-publish-dryrun:
    name: docker-build-publish-dryrun
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: Build Docker Container Image (Dry Run)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: Dockerfile
          push: false
          tags: alos:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
        continue-on-error: true

  auto-release-notes:
    name: auto-release-notes
    needs: [build-python-wheel, build-rust-binary]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate Release Notes Draft
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          generate_release_notes: true
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
