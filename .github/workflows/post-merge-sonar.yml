name: Post-Merge SonarCloud Analysis
on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.sha }}
  cancel-in-progress: false

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync

      - name: Run pytest with coverage XML
        run: uv run pytest --cov=alos --cov-report=xml:coverage.xml -q || true

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.organization=${{ vars.SONAR_ORG || 'brandon-fox' }}
