name: Performance Benchmark & Regression Tracking

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'alos/**'
      - 'crates/**'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-benchmark:
    name: rust-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust (cached)
        uses: brandon-fox/.github/.github/actions/setup-rust-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
        with:
          workspaces: crates/alos_native
      - name: Run Cargo Bench / Check
        run: cargo check --manifest-path crates/alos_native/Cargo.toml --benches || true

  python-microbenchmarks:
    name: python-microbenchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: brandon-fox/.github/.github/actions/setup-uv-cached@595a8111464a72b0d27e3e7391dcc713f002a73a # main
      - name: Run Pytest Performance Suite
        run: uv run pytest tests/ -m "not slow" -k "perf or benchmark or latency" || true
