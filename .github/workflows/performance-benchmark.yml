name: Performance Benchmark & Regression Tracking

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'alos/**'
      - 'crates/**'
      - 'pyproject.toml'
  workflow_dispatch:

concurrency:
  group: benchmark-${{ github.head_ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-benchmark:
    name: rust-benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - name: Cache Rust Build Artifacts
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.7.7
        with:
          workspaces: crates/alos_native
      - name: Run Cargo Bench / Check
        run: cargo check --manifest-path crates/alos_native/Cargo.toml --benches || true

  python-microbenchmarks:
    name: python-microbenchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v5.3.0
        with:
          enable-cache: true
      - run: uv sync --extra dev
      - name: Run Pytest Performance Suite
        run: uv run pytest tests/ -m "not slow" -k "perf or benchmark or latency" || true
