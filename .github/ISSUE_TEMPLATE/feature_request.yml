name: Feature / Spec Proposal
description: Propose a new capability governed by SpecKit SDD
labels: ["enhancement", "specs"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem & Motivation
      placeholder: What user or architectural need does this solve?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Proposed Acceptance Criteria (Given / When / Then)
      placeholder: "Given ..., When ..., Then ..."
    validations:
      required: true
