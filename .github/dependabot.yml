version: 2
updates:
  # Python dependencies via uv (grouped runtime + dev to minimize PR churn)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # pytest 9.2.0 removed FixtureManager._arg2fixturedefs, breaking pytest-bdd 8.1.0
      - dependency-name: "pytest"
        versions: [">=9.2.0"]
    open-pull-requests-limit: 5

  # Rust native extension dependencies (crates/alos_native)
  - package-ecosystem: "cargo"
    directory: "/crates/alos_native"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "rust"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    groups:
      rust-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    open-pull-requests-limit: 3

  # GitHub Actions 40-char SHA updates (grouped so 1 weekly PR updates all actions together)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci/cd"
      - "automated"
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 3

  # Docker base image versions
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "infrastructure"
      - "automated"
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # The base image follows requires-python (<3.14); do not propose untested minors.
      - dependency-name: "python"
        versions: [">=3.14"]
    open-pull-requests-limit: 2
