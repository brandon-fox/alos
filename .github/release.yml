changelog:
  exclude:
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions[bot]
  categories:
    - title: Features
      labels:
        - enhancement
        - python
        - rust
    - title: Security & CI/CD Governance
      labels:
        - security
        - ci
    - title: Documentation & Architecture
      labels:
        - documentation
        - specs
    - title: Other Changes
      labels:
        - "*"
