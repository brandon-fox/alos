repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=500']
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Lint Check (pre-commit)
        entry: uv run ruff check --fix
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: ruff-format
        name: Ruff Format Check (pre-commit)
        entry: uv run ruff format
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: cargo-fmt
        name: Cargo Rust Formatter (pre-commit)
        entry: python -c "import subprocess, shutil; cmd = shutil.which('cargo'); subprocess.run([cmd, 'fmt', '--manifest-path', 'crates/alos_native/Cargo.toml']) if cmd else print('Cargo not available locally, skipping cargo fmt')"
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: pytest-light-unit
        name: Light Unit & Meta Tests (pre-commit)
        entry: uv run python scripts/run_pytest_clean.py -m "not docker" --ignore=tests/benchmarks -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: bandit-check
        name: Security Vulnerability Scan (bandit)
        entry: uv run bandit -r alos -s B101
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: mypy-check
        name: Strict Type Check (mypy)
        entry: uv run mypy alos tests features scripts
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-check
        name: Unit Tests & Coverage Gate >=90% (pytest)
        entry: uv run python scripts/run_pytest_clean.py --cov=alos --cov-report=term-missing --cov-fail-under=90
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: behave-bdd-check
        name: Behave BDD Suite - Parallel Mocked & Serialized Live (pre-push)
        entry: uv run python scripts/run_behave_parallel.py --profile full
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: mkdocs-strict-check
        name: Documentation Link & Build Integrity (mkdocs --strict)
        entry: uv run mkdocs build --strict -d .pytest_tmp/mkdocs_site
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: pyadr-check
        name: ADR Repository Sanity Gate (pyadr)
        entry: uv run pyadr check-adr-repo --no-ansi
        language: system
        pass_filenames: false
        stages: [pre-push]
