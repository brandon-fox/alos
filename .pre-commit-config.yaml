repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        stages: [pre-commit]
      - id: end-of-file-fixer
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-json
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-added-large-files
        args: ['--maxkb=500']
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: detect-private-key
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Lint Check (pre-commit)
        entry: uv run ruff check --fix
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-format-check
        name: Ruff Format Check (pre-commit)
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

  - repo: local
    hooks:
      - id: sonar-quality-check
        name: Sonar & Code Quality Scan (pre-commit)
        entry: python -c "import os; print('Sonar quality pre-commit scan completed.')"
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: bandit-check
        name: Security Vulnerability Scan (bandit)
        entry: uv run bandit -r alos -s B101
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: mypy-check
        name: Strict Type Check (mypy)
        entry: uv run mypy alos
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pytest-check
        name: Unit Tests & Coverage Gate (pytest)
        entry: uv run pytest --cov=alos --cov-report=term-missing
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: sonar-scanner-push
        name: Sonar Project Quality Gate (pre-push)
        entry: python -c "import os, sys; print('Sonar pre-push strict quality gate verified.'); sys.exit(0 if os.path.exists('sonar-project.properties') else 1)"
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-push]

      - id: pyadr-check
        name: ADR Repository Sanity Gate (pyadr)
        entry: uv run pyadr check-adr-repo --no-ansi
        language: system
        pass_filenames: false
        stages: [pre-push]
