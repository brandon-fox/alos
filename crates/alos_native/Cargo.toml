[package]
name = "alos_native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "alos_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23.0", features = ["extension-module"] }
rayon = "1.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.10"
petgraph = "0.6"
