[package]
name = "alos_native"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "alos_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.23.0"
rayon = "1.8.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
regex = "1.10"
petgraph = "0.6"
walkdir = "2"

[features]
# The extension-module feature stops PyO3 from linking libpython, which is right for the
# importable module and wrong for `cargo test`. Tests run with --no-default-features.
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]
