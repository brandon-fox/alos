[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["alos*"]

[tool.setuptools.package-data]
"alos.templates.vault" = ["*.md"]

[project]
name = "alos"
version = "0.1.0"
authors = [{ name = "Brandon Fox", email = "bfoxtrotfarm@gmail.com" }]
license = { text = "MIT" }
description = "Local Autonomous Life Operating System (ALOS)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.52",
    "alembic>=1.19.1",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "python-frontmatter>=1.0.0",
    "networkx>=3.0",
    "rank-bm25>=0.2.2",
    "mcp>=1.0.0",
    "apscheduler>=3.10.0",
    "langgraph>=1.2.11",
    "langchain-core>=1.5.5",
    "crewai>=0.80.0",
]

[project.scripts]
alos = "alos.cli:main"
alos-governor = "alos.swarm.queue:main"
alos-dispatcher = "alos.swarm.dispatcher:main"
alos-sandbox = "alos.swarm.sandbox:main"

[project.optional-dependencies]
dev = [
    "pre-commit>=4.6.2",
    "pyadr>=0.16.2",
    "specify-cli>=0.16.4",
    "maturin>=1.5.0",
    "ruff>=0.16.3",
    "mypy>=1.6.0",
    "bandit>=1.7.5",
    "pytest>=7.4.0,<9.2.0",
    "pytest-cov>=4.1.0",
    "pytest-bdd>=7.0.0",
    "twine>=5.0.0",
    "behave>=1.2.6",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.4.0",
    "hypothesis>=6.150.0",
]

[dependency-groups]
dev = [
    "types-networkx>=3.6.1.20260728",
    "types-pyyaml>=6.0.12.20260724",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "meta: Meta-testing suite for repository structure, SpecKit adherence, ADR compliance, and AST quality metrics",
    "source: Source code testing suite targeting ALOS runtime packages",
    "docker: Starts real containers; runs only when ALOS_SANDBOX_IMAGE names a local image",
    "mocked: Deterministic mocked BDD and integration scenarios",
    "live: Live local runtime, socket, and HTTP endpoint BDD scenarios",
    "linux_only: Contract tests targeting Linux /proc and POSIX process groups",
    "windows_only: Contract tests targeting Windows native Win32/NVML APIs",
    "fuzz: Property-based and stateful Hypothesis fuzzing suite",
    "contention: Multi-thread and multi-process concurrency contention stress suite",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security checks)
    "PGH",  # pygrep-hooks (enforces specific noqa codes, disallows bare noqa)
    "RUF",  # ruff-specific rules (enforces unused noqa removal)
    "UP",   # pyupgrade (modern Python 3.10+ syntax enforcement)
    "SIM",  # flake8-simplify (code simplification rules)
    "PL",   # Pylint (refactoring, code smells, design checks)
]
ignore = [
    "S101",    # Use of assert in tests
    "PLR2004", # Magic value comparison in checks
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "PLC0415", # Top-level import (lazy circular dependency resolution)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "PLC0415"]
"features/**" = ["S101", "PLC0415"]

[tool.behave]
paths = ["features"]
stdout_capture = false
stderr_capture = false
log_capture = false
show_timings = true

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
enable_error_code = ["ignore-without-code"]
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["behave"]
ignore_missing_imports = true

[tool.bandit]
targets = ["alos"]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.uv]
override-dependencies = [
    "json-repair>=0.60.1",
    "chromadb>=1.5.0",
    "python-slugify>=8.0.0",
]

[tool.coverage.run]
branch = true
parallel = true
sigterm = true
source = ["alos"]

[tool.coverage.paths]
source = [
    "alos/",
    "/home/runner/work/alos/alos/alos/",
    "D:\\a\\alos\\alos\\alos\\",
    "C:\\Users\\*\\*\\alos\\",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.mutmut]
paths_to_mutate = "alos/core/evaluator.py,alos/core/graph.py,alos/swarm/governor.py,alos/swarm/queue.py,alos/swarm/sandbox.py,alos/runtime.py"
tests_dir = "tests/"
runner = "python -m pytest -p no:xdist -p no:cov -x -q -m 'not docker and not live'"
