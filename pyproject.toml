[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["alos*"]


[project]
name = "alos"
version = "0.1.0"
description = "Local Autonomous Life Operating System (ALOS)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg[binary]>=3.1.0",
    "python-frontmatter>=1.0.0",
    "networkx>=3.0",
    "rank-bm25>=0.2.2",
    "mcp>=1.0.0",
    "apscheduler>=3.10.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=3.5.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
    "bandit>=1.7.5",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[dependency-groups]
dev = [
    "types-networkx>=3.6.1.20260728",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "S",    # flake8-bandit (security checks)
    "PGH",  # pygrep-hooks (enforces specific noqa codes, disallows bare noqa)
    "RUF",  # ruff-specific rules (enforces unused noqa removal)
    "UP",   # pyupgrade (modern Python 3.10+ syntax enforcement)
    "SIM",  # flake8-simplify (code simplification rules)
    "PL",   # Pylint (refactoring, code smells, design checks)
]
ignore = [
    "S101",    # Use of assert in tests
    "PLR2004", # Magic value comparison in checks
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "PLC0415", # Top-level import (lazy circular dependency resolution)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "PLC0415"]


[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true
strict_optional = true
enable_error_code = ["ignore-without-code"]
disallow_untyped_defs = false
check_untyped_defs = true

[tool.bandit]
targets = ["alos"]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]
