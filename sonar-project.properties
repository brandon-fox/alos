# SonarQube / SonarCloud project configuration for ALOS
sonar.projectKey=alos-life-os
sonar.projectName=ALOS - Local Autonomous Life Operating System
sonar.projectVersion=0.1.0

# Source & Test paths
sonar.sources=alos,alembic
sonar.tests=tests
sonar.python.version=3.10

# Coverage & Test Reporting
sonar.python.coverage.reportPaths=coverage.xml

# Quality Gate & Rules
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/__pycache__/**,*.pyc,.venv/**,.mypy_cache/**,.pytest_cache/**,.ruff_cache/**
